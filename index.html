<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>投研工作台</title>
<style>
:root{
  --bg-primary:#0A0E17;
  --bg-sidebar:#0D1220;
  --bg-hover:#111827;
  --bg-active:#1A2636;
  --bg-card:#111827;
  --bg-input:#111827;
  --border:#1F2937;
  --text-primary:#FFFFFF;
  --text-secondary:#D1D5DB;
  --text-muted:#9CA3AF;
  --text-dim:#6B7280;
  --accent:#00E5FF;
  --accent-purple:#8B5CF6;
  --success:#10B981;
  --icon-dim:#374151;
  --sidebar-width:240px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{
  font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg-primary);color:var(--text-primary);
  min-height:100vh;line-height:1.5;
}

/* ====== HEADER ====== */
.header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:56px;background:var(--bg-sidebar);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;
}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent-purple));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:16px;
}
.header-info{display:flex;flex-direction:column;line-height:1.2}
.header-title{font-size:16px;font-weight:600;color:var(--text-primary)}
.header-sub{font-size:11px;color:var(--text-muted)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.header-date{font-size:13px;color:var(--text-muted)}
.menu-toggle{
  display:none;background:none;border:none;color:var(--text-primary);
  font-size:1.4rem;cursor:pointer;padding:4px 6px;line-height:1;
}

/* ====== SIDEBAR ====== */
.sidebar{
  position:fixed;top:56px;left:0;bottom:0;
  width:var(--sidebar-width);background:var(--bg-sidebar);
  border-right:1px solid var(--border);
  overflow-y:auto;z-index:90;display:flex;flex-direction:column;
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.nav-group{padding:8px 0}
.nav-group-label{
  padding:10px 16px 4px;font-size:11px;font-weight:600;
  color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 16px 8px 14px;cursor:pointer;
  font-size:13px;color:var(--text-secondary);
  border-left:2px solid transparent;
  transition:all .15s;user-select:none;
}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-item.active{
  background:var(--bg-active);color:var(--accent);
  border-left-color:var(--accent);
}
.nav-item .nav-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}

/* 工具与模板的子项 */
.nav-sub{
  max-height:0;overflow:hidden;transition:max-height .25s ease;
}
.nav-sub.expanded{max-height:200px}
.nav-sub-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 16px 7px 46px;cursor:pointer;
  font-size:12px;color:var(--text-muted);
  transition:all .15s;
}
.nav-sub-item:hover{color:var(--text-primary);background:var(--bg-hover)}
.nav-sub-item.active{color:var(--accent);background:var(--bg-active)}
.nav-item.has-children .nav-arrow{
  margin-left:auto;font-size:10px;color:var(--text-dim);
  transition:transform .2s;
}
.nav-item.has-children.open .nav-arrow{transform:rotate(90deg)}

/* Sidebar footer */
.sidebar-footer{
  margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:8px;font-size:11px;color:var(--success);
}
.sidebar-footer .dot{
  width:6px;height:6px;border-radius:50%;background:var(--success);
}

/* ====== MAIN ====== */
.main{
  margin-left:var(--sidebar-width);padding:24px 32px;
  min-height:calc(100vh - 56px);padding-top:80px;
}
.main-inner{max-width:1000px}

/* Page title */
.page-title{font-size:24px;font-weight:700;color:var(--text-primary);margin-bottom:20px}

/* Search bar */
.search-bar{
  display:flex;align-items:center;background:var(--bg-input);
  border-radius:10px;padding:10px 16px;gap:12px;margin-bottom:32px;
}
.search-bar .search-icon{color:var(--text-dim);display:flex}
.search-bar input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text-primary);font-size:14px;font-family:inherit;
}
.search-bar input::placeholder{color:var(--text-dim)}
.btn-add{
  flex-shrink:0;padding:8px 18px;border-radius:8px;border:none;
  background:linear-gradient(90deg,var(--accent),var(--accent-purple));
  color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;white-space:nowrap;
  transition:filter .15s;
}
.btn-add:hover{filter:brightness(1.15)}

/* Empty state */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;text-align:center;
}
.empty-icon{color:var(--icon-dim);margin-bottom:16px}
.empty-text{font-size:14px;color:var(--text-dim)}

/* Readme card */
.readme-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;padding:20px 24px;margin-bottom:16px;
}
.readme-card h2{
  font-size:16px;color:var(--accent);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.readme-card h2 .breadcrumb{font-size:12px;color:var(--text-dim);font-weight:400}
.readme-card .desc{font-size:14px;color:var(--text-secondary);line-height:1.7}
.readme-card .meta{
  font-size:12px;color:var(--text-dim);margin-top:12px;
  padding-top:10px;border-top:1px solid var(--border);
}

/* Template preview */
.tpl-preview{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;margin-bottom:16px;overflow:hidden;
}
.tpl-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:var(--bg-active);border-bottom:1px solid var(--border);
}
.tpl-header h3{font-size:14px;color:var(--text-primary);display:flex;align-items:center;gap:8px}
.tpl-header .tag{
  font-size:11px;padding:2px 8px;border-radius:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent-purple));color:#fff;
}
.tpl-body{
  padding:16px 20px;max-height:520px;overflow-y:auto;
  font-size:13px;line-height:1.7;color:var(--text-secondary);
}
.tpl-body::-webkit-scrollbar{width:4px}
.tpl-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tpl-body h1{font-size:17px;margin:0 0 8px;color:var(--text-primary)}
.tpl-body h2{
  font-size:14px;margin:16px 0 6px;color:var(--accent);
  border-bottom:1px solid var(--border);padding-bottom:4px;
}
.tpl-body h3{font-size:13px;margin:12px 0 4px;color:var(--text-primary)}
.tpl-body p{margin:4px 0}
.tpl-body ul{margin:4px 0;padding-left:18px}
.tpl-body li{margin:2px 0;color:var(--text-muted)}
.tpl-body table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12px}
.tpl-body th,.tpl-body td{border:1px solid var(--border);padding:4px 8px;text-align:left}
.tpl-body th{background:var(--bg-hover);color:var(--text-primary);font-weight:600}
.tpl-body td{color:var(--text-muted)}
.tpl-body hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.tpl-body strong{color:var(--text-primary)}

/* Template list */
.tpl-list{display:flex;flex-direction:column;gap:12px}
.tpl-list-item{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:10px;padding:14px 18px;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;gap:12px;
}
.tpl-list-item:hover{border-color:var(--accent);background:var(--bg-hover)}
.tpl-list-item .tpl-icon{
  width:36px;height:36px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent-purple));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;flex-shrink:0;
}
.tpl-list-item .tpl-info h4{font-size:14px;color:var(--text-primary);margin-bottom:2px}
.tpl-list-item .tpl-info p{font-size:12px;color:var(--text-muted)}

/* Overlay */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:85}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .main{margin-left:0;padding:16px;padding-top:72px}
  .menu-toggle{display:block}
  .search-bar{flex-wrap:wrap}
  .btn-add{width:100%;text-align:center}
}

/* report list for 行业研究 */
.report-list{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.report-item{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.report-item a{color:var(--accent);text-decoration:none;font-size:14px;font-weight:600}
.report-item a:hover{text-decoration:underline}
.report-desc{color:var(--text-muted);font-size:12px}

/* ====== 通用文档（新增/查询）====== */
.btn-export{
  flex-shrink:0;padding:8px 16px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg-input);color:var(--text-secondary);font-size:13px;font-weight:500;
  cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;
}
.btn-export:hover{border-color:var(--accent);color:var(--accent)}

.docs-section{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.docs-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.docs-header h3{font-size:15px;color:var(--text-primary);display:flex;align-items:center;gap:8px}
.docs-count{font-size:12px;color:var(--text-dim)}
.doc-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:10px;
  padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s;
}
.doc-card:hover{border-color:var(--accent);background:var(--bg-hover)}
.doc-card .doc-icon{
  width:38px;height:38px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-purple));
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;
}
.doc-card .doc-info{flex:1;min-width:0}
.doc-card .doc-info h4{font-size:14px;color:var(--text-primary);margin-bottom:2px;word-break:break-all}
.doc-card .doc-info p{font-size:12px;color:var(--text-muted);word-break:break-all}
.doc-card .doc-type{
  flex-shrink:0;font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;
}
.doc-type.md{background:rgba(0,229,255,.12);color:var(--accent);border:1px solid rgba(0,229,255,.3)}
.doc-type.pdf{background:rgba(139,92,246,.15);color:#C4B5FD;border:1px solid rgba(139,92,246,.4)}
.doc-type.link{background:rgba(16,185,129,.12);color:var(--success);border:1px solid rgba(16,185,129,.3)}
.doc-card .doc-open{color:var(--text-dim);font-size:12px;flex-shrink:0}
.doc-card .doc-del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:4px;flex-shrink:0;font-family:inherit}
.doc-card .doc-del:hover{background:var(--bg-hover);color:#e5484d}
.btn-restore{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer;font-family:inherit;margin-left:8px}
.btn-restore:hover{color:#e5484d;border-color:#e5484d}

.doc-preview{
  background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  margin-top:16px;overflow:hidden;display:none;
}
.doc-preview.show{display:block}
.doc-preview .prev-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:var(--bg-active);border-bottom:1px solid var(--border);
}
.doc-preview .prev-header h3{font-size:14px;color:var(--text-primary);display:flex;align-items:center;gap:8px}
.doc-preview .prev-body{padding:16px 20px;max-height:560px;overflow-y:auto;font-size:13px;line-height:1.7;color:var(--text-secondary)}
.doc-preview .prev-close{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:12px;font-family:inherit}
.doc-preview .prev-close:hover{color:var(--text-primary);border-color:var(--text-dim)}

/* Modal */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;
  align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal{
  width:520px;max-width:92vw;background:var(--bg-card);border:1px solid var(--border);
  border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden;
}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;background:var(--bg-active);border-bottom:1px solid var(--border);
}
.modal-header h3{font-size:15px;color:var(--text-primary)}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;line-height:1}
.modal-close:hover{color:var(--text-primary)}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-body label{font-size:12px;color:var(--text-muted);display:flex;flex-direction:column;gap:6px}
.modal-body input,.modal-body select,.modal-body textarea{
  background:var(--bg-input);border:1px solid var(--border);border-radius:8px;
  color:var(--text-primary);font-size:13px;padding:9px 12px;font-family:inherit;outline:none;width:100%;
}
.modal-body input:focus,.modal-body select:focus,.modal-body textarea:focus{border-color:var(--accent)}
.modal-body textarea{resize:vertical;min-height:64px}
.modal-footer{
  display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);
}
.btn-plain{
  padding:8px 18px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg-input);color:var(--text-secondary);font-size:13px;cursor:pointer;font-family:inherit;
}
.btn-plain:hover{border-color:var(--text-dim);color:var(--text-primary)}

@media(max-width:768px){
  .btn-export{width:100%;text-align:center}
}
/* ============================ 宏观研究页 ============================ */
.macro-wrap{display:flex;flex-direction:column;gap:14px}
.macro-panel{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:14px;padding:16px 18px 18px;
}
.macro-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:14px;flex-wrap:wrap;
}
.macro-head-l{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--text-primary)}
.macro-head-l .bar{width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent-purple))}
.macro-head-l .sub{font-size:11px;font-weight:400;color:var(--text-dim)}
.macro-head-r{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text-dim)}
.btn-mini{
  background:var(--bg-hover);border:1px solid var(--border);color:var(--text-secondary);
  font-size:11px;font-family:inherit;padding:4px 10px;border-radius:6px;cursor:pointer;
  transition:all .15s;
}
.btn-mini:hover{border-color:var(--accent);color:var(--accent)}

.macro-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.macro-card{
  background:var(--bg-hover);border:1px solid var(--border);
  border-radius:11px;padding:12px 14px 8px;
}
.macro-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.macro-card-name{font-size:12.5px;font-weight:600;color:var(--text-secondary)}
.macro-card-meta{font-size:10.5px;color:var(--text-dim);margin-top:2px}
.macro-card-num{text-align:right;flex-shrink:0}
.macro-last{font-size:17px;font-weight:700;color:var(--text-primary);letter-spacing:.2px}
.macro-chg{display:block;font-size:11.5px;font-weight:600;margin-top:1px}
.up{color:#FF4D4F}      /* 涨 - 红 */
.down{color:#10B981}    /* 跌 - 绿 */
.flat{color:var(--text-dim)}
.macro-legend{display:flex;gap:12px;margin:6px 0 2px;flex-wrap:wrap}
.macro-legend span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-muted)}
.macro-legend i{width:10px;height:2px;border-radius:1px;display:inline-block}
.macro-chart{margin-top:2px}
.macro-chart svg{display:block;width:100%;height:auto}
.macro-foot{
  font-size:10px;color:var(--text-dim);margin-top:6px;
  padding-top:6px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;
}

/* 盘前提示（波动曲线下方） */
.macro-insight{
  margin-top:14px;padding:12px 14px 13px;border-radius:10px;
  background:linear-gradient(180deg,rgba(0,229,255,.07),rgba(0,229,255,.02));
  border:1px solid rgba(0,229,255,.18);border-left:3px solid var(--accent);
}
.macro-insight-h{
  display:flex;align-items:center;gap:7px;margin-bottom:8px;
  font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.3px;
}
.macro-insight-h .dot{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 3px rgba(0,229,255,.15);
}
.macro-insight-lead{
  font-size:12.5px;line-height:1.8;color:var(--text-secondary);margin-bottom:9px;
}
.macro-insight-list{display:flex;flex-direction:column;gap:7px}
.macro-insight-row{
  display:flex;gap:9px;align-items:flex-start;
  font-size:12px;line-height:1.75;color:var(--text-muted);
}
.macro-insight-row .k{flex-shrink:0;min-width:74px;font-weight:600;color:var(--text-secondary)}
.macro-insight-row .v{flex:1;min-width:0}
.macro-insight-row .v em{font-style:normal;font-weight:700;margin-right:4px}
.macro-insight-row.pos .v em{color:#FF4D4F}
.macro-insight-row.neg .v em{color:#10B981}
.macro-insight-row.neu .v em{color:var(--text-dim)}
.macro-insight-foot{
  margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);
  font-size:10.5px;color:var(--text-dim);line-height:1.6;
}

.macro-sep{
  display:flex;align-items:center;gap:10px;margin:2px 0;
  font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.5px;
}
.macro-sep::after{content:"";flex:1;height:1px;background:var(--border)}

.policy-list{display:flex;flex-direction:column;gap:10px}
.policy-item{
  background:var(--bg-hover);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:10px;padding:12px 14px;transition:all .15s;
}
.policy-item:hover{border-color:var(--accent);background:#131B2B}
.policy-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.policy-tag{
  font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;
  background:rgba(0,229,255,.12);color:var(--accent);border:1px solid rgba(0,229,255,.25);
}
.policy-tag.p2{background:rgba(139,92,246,.12);color:#A78BFA;border-color:rgba(139,92,246,.25)}
.policy-tag.p3{background:rgba(16,185,129,.12);color:#34D399;border-color:rgba(16,185,129,.25)}
.policy-tag.p4{background:rgba(245,197,66,.12);color:#F5C542;border-color:rgba(245,197,66,.25)}
.policy-date{font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.policy-title{font-size:13.5px;font-weight:600;color:var(--text-primary);margin-bottom:5px;line-height:1.5}
.policy-sum{font-size:12px;color:var(--text-muted);line-height:1.75}
.policy-src{font-size:10.5px;color:var(--text-dim);margin-top:7px}
.macro-loading{padding:24px;text-align:center;font-size:12px;color:var(--text-dim)}

@media(max-width:1100px){
  .macro-grid{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>

<header class="header">
  <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
  <div class="header-left">
    <div class="header-logo">&#9650;</div>

function selectItem(el) {
  document.querySelectorAll('.nav-item, .nav-sub-item').forEach(function(e){ e.classList.remove('active'); });
  el.classList.add('active');

  var dirKey = el.dataset.id;
  var name = el.dataset.name;

  // If sub-item: expand parent
  if (el.dataset.isSub === '1') {
    var prev = el.parentElement.previousElementSibling;
    if (prev && prev.classList.contains('has-children')) {
      prev.classList.add('open');
      el.parentElement.classList.add('expanded');
    }
  }

  // Update page title
  var title = mainContent.querySelector('.page-title');
  if (title) title.textContent = name;

  var descKey = dirKey + '|||' + name;
  var desc = README[descKey] || '';
  var isTplItem = dirKey === '07-工具与模板' && TM[name];

  var html = '';

  if (isTplItem) {
    // Show template preview
    html += '<div class="readme-card"><h2>' + name + '</h2><div class="desc">' + desc + '</div></div>';
    html += '<div class="tpl-preview"><div class="tpl-header"><h3><span class="tag">模板预览</span> ' + name + '.md</h3></div>';

      html += '<div class="tpl-list-item" onclick="selectByName(\'07-工具与模板\',\'\'+tn+\'\')">';

  } else if (name === '每日晨报') {

    html += '<div class="tpl-preview"><div class="tpl-header"><h3><span class="tag">每日晨报</span> <span id="morningReportTitle">正在加载...</span></h3></div>';
    html += '<div class="tpl-body" id="morningReportBody" style="padding:0"><div class="empty-text">正在加载晨报数据...</div></div></div>';
  } else if (dirKey === '01-投研信息收集' && name === '宏观研究') {
    // 宏观研究：上半页 = 全球资产近一周波动曲线；下半页 = 中国宏观政策信息
    html += buildMacroShell();

// ============ MARKDOWN RENDER ============
function renderMD(md) {
  var h = md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^---$/gm,'<hr>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^- (.+)$/gm,'<li>$1</li>');
  h = h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h = h.replace(/((?:\|.+\|\n)+)/g,function(m){
    var lines=m.trim().split('\n').filter(function(l){return l.indexOf('|')!==-1});
    if(lines.length<2)return m;
    var dl=lines.filter(function(l){return !/^\|[\s\-:|]+\|$/.test(l)});
    if(dl.length===0)return m;
    var th='<thead><tr>'+dl[0].split('|').filter(function(c){return c.trim()}).map(function(c){return'<th>'+c.trim()+'</th>'}).join('')+'</tr></thead>';
    var tb='<tbody>'+dl.slice(1).map(function(l){
      return'<tr>'+l.split('|').filter(function(c){return c.trim()}).map(function(c){return'<td>'+c.trim()+'</td>'}).join('')+'</tr>'
    }).join('')+'</tbody>';
    return'<table>'+th+tb+'</table>';
  });
  h=h.replace(/\n\n/g,'</p><p>');
  h='<p>'+h+'</p>';
  h=h.replace(/<p>\s*<\/p>/g,'');
  h=h.replace(/<p><h([1-3])>/g,'<h$1>');
  h=h.replace(/<\/h([1-3])><\/p>/g,'</h$1>');
  h=h.replace(/<p><ul>/g,'<ul>');
  h=h.replace(/<\/ul><\/p>/g,'</ul>');
  h=h.replace(/<p><table>/g,'<table>');
  h=h.replace(/<\/table><\/p>/g,'</table>');
  h=h.replace(/<p><hr><\/p>/g,'<hr>');
  return h;
}

// ============ DOCS (MANIFEST + LOCALSTORAGE) ============
var consoleDocsKey = 'console-docs-v1';
var MANIFEST = {};
var currentSection = null;
var localDocs = [];
var docCache = [];

function guessType(file){
  var f = String(file || '').toLowerCase();
  if (/\.pdf\b/.test(f) || /\.pdf(\?|$)/.test(f)) return 'pdf';
  if (/\.json(\?|$)/.test(f)) return 'json';
  if (/^https?:\/\//.test(f) || /^\/\//.test(f)) return 'link';
  return 'md';
}
function loadLocalDocs() {
  try {
    var raw = localStorage.getItem(consoleDocsKey);
    localDocs = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(localDocs)) localDocs = [];
  } catch (e) { localDocs = []; }
}
function saveLocalDocs() {
  try { localStorage.setItem(consoleDocsKey, JSON.stringify(localDocs)); } catch (e) {}
}
loadLocalDocs();

// 删除标记（针对 manifest 内置文档：前端删除=本地隐藏，导出清单时同步剔除）
var deletedDocsKey = 'console-deleted-v1';
var deletedDocs = {}; // {section: [file,...]}
function loadDeletedDocs() {
  try {
    var raw = localStorage.getItem(deletedDocsKey);
    deletedDocs = raw ? JSON.parse(raw) : {};
    if (typeof deletedDocs !== 'object' || Array.isArray(deletedDocs)) deletedDocs = {};
  } catch (e) { deletedDocs = {}; }
}
function saveDeletedDocs() {
  try { localStorage.setItem(deletedDocsKey, JSON.stringify(deletedDocs)); } catch (e) {}
}
function isDeleted(section, file) {
  var arr = deletedDocs[section];
  return !!(arr && arr.indexOf(file) !== -1);
}
loadDeletedDocs();

function NavNames() {
  var names = [];
  NAV.forEach(function(g){ g.items.forEach(function(it){
    if (it.children && it.children.length) it.children.forEach(function(c){ names.push(c); });
    else names.push(it.name);
  });});
  return names;
}
function getSectionDocs(section) {
  var list = [];
  var m = (MANIFEST && MANIFEST[section]) || [];
  m.forEach(function(d){ if (isDeleted(section, d.file)) return; list.push({title:d.title,file:d.file,type:d.type||guessType(d.file),desc:d.desc||'',local:false,section:section}); });
  localDocs.forEach(function(d){
    if (d.section === section) list.push({title:d.title,file:d.file,type:d.type||guessType(d.file),desc:d.desc||'',local:true,section:d.section});
  });
  return list;
}
function getSearchKw(){ var i = document.getElementById('searchInput'); return i ? i.value : ''; }

// 预加载 manifest（fetch 失败静默降级为空）
fetch('data/manifest.json', { cache: 'no-store' })
  .then(function(res){ if (!res.ok) throw new Error('not found'); return res.json(); })
  .then(function(data){ MANIFEST = data || {}; if (currentSection) renderDocList(currentSection, getSearchKw()); })
  .catch(function(){ MANIFEST = {}; });

function renderDocList(section, kw) {
  var box = document.getElementById('docsSection');
  if (!box) return;
  var docs = getSectionDocs(section);
  if (kw && (kw = kw.trim())) {
    var k = kw.toLowerCase();
    docs = docs.filter(function(d){
      return (d.title||'').toLowerCase().indexOf(k) !== -1 || (d.desc||'').toLowerCase().indexOf(k) !== -1;
    });
  }
  docCache = docs;
  var delCount = (deletedDocs[section] || []).length;

function filterDocs(kw) {
  var box = document.getElementById('docsSection');
  if (!box) return;
  var cards = box.querySelectorAll('.doc-card');
  var k = (kw || '').trim().toLowerCase();
  var visible = 0;
  cards.forEach(function(c){
    var hit = !k || (c.dataset.title||'').toLowerCase().indexOf(k) !== -1 || (c.dataset.desc||'').toLowerCase().indexOf(k) !== -1;
    c.style.display = hit ? '' : 'none';
    if (hit) visible++;
  });
  var count = box.querySelector('.docs-count');
  if (count) count.textContent = '共 ' + visible + ' 篇';
}

function openDocByIdx(idx) {
  var d = docCache[idx];
  if (!d) return;
  if (d.type === 'pdf' || /\.pdf(\?|$)/i.test(d.file)) { window.open(d.file, '_blank'); return; }
  if (d.type === 'link' || /^https?:\/\//i.test(d.file)) { window.open(d.file, '_blank'); return; }
  // md：fetch 内容页内预览
  var prev = document.getElementById('docPreview');
  if (!prev) {
    prev = document.createElement('div');
    prev.id = 'docPreview';
    prev.className = 'doc-preview';

    .then(function(res){ if (!res.ok) throw new Error('not found'); return res.text(); })
    .then(function(txt){ var pb = document.querySelector('#docPreview .prev-body'); if (pb) pb.innerHTML = renderMD(txt); })
    .catch(function(){ var pb = document.querySelector('#docPreview .prev-body'); if (pb) pb.innerHTML = '<p style="color:var(--text-muted)">无法加载该文档（本地 file:// 下浏览器会拦截请求，请以 https 方式访问部署版本）。</p>'; });
}
function closeDocPreview(){

// ============ DELETE / RESTORE ============
function delDocByIdx(idx) {
  var d = docCache[idx];
  if (!d) return;
  if (!window.confirm('确认删除文档「' + d.title + '」？\n（已添加的文档将被移除；内置清单文档将从列表中隐藏，可随时恢复）')) return;
  if (d.local) {
    // 用户新增的文档：真正移除
    localDocs = localDocs.filter(function(x){ return !(x.section === d.section && x.title === d.title && x.file === d.file); });
    saveLocalDocs();
  } else {
    // manifest 内置文档：标记隐藏
    if (!deletedDocs[d.section]) deletedDocs[d.section] = [];
    if (deletedDocs[d.section].indexOf(d.file) === -1) deletedDocs[d.section].push(d.file);
    saveDeletedDocs();
    // 关闭可能打开的预览
    closeDocPreview();
  }
  renderDocList(currentSection, getSearchKw());
}
function restoreDeleted(section) {
  if (!section) return;
  closeDocPreview();
  delete deletedDocs[section];
  saveDeletedDocs();
  renderDocList(section, getSearchKw());
}

// 从本地选取文件：自动填充标题/路径/类型，仅登记元信息；文件本体验证并放置在本地工作台对应目录，由自动同步任务上线
var FILE_EXT_MAP = {pdf:'pdf', md:'md', markdown:'md', txt:'md', html:'html', htm:'html', json:'json', csv:'csv', xlsx:'xlsx', xls:'xlsx', pptx:'pptx', ppt:'pptx', docx:'docx', doc:'docx', png:'image', jpg:'image', jpeg:'image', gif:'image', webp:'image'};
function guessLocalDir(section){
  var m = {}, best = '', bestN = 0;
  getSectionDocs(section).forEach(function(d){
    var f = String(d.file || '');
    if (/^https?:/i.test(f)) return;
    var idx = f.lastIndexOf('/');
    if (idx > 0) { var p = f.slice(0, idx); m[p] = (m[p] || 0) + 1; }
  });
  for (var k in m) if (m[k] > bestN) { best = k; bestN = m[k]; }
  return best || 'data';
}
function pickLocalFile(inp){
  var f = inp.files && inp.files[0];
  var name = f ? f.name : ''; var size = f ? f.size : 0;
  if (inp) inp.value = '';
  if (!name) return;
  var dot = name.lastIndexOf('.');
  var ext = dot >= 0 ? name.slice(dot + 1).toLowerCase() : '';
  var stem = dot > 0 ? name.slice(0, dot) : name;
  var type = FILE_EXT_MAP[ext] || 'file';
  var section = document.getElementById('docSectionSel').value;
  var dir = guessLocalDir(section);
  document.getElementById('docTitle').value = stem;
  document.getElementById('docFile').value = dir + '/' + name;

  var info = document.getElementById('docLocalFileInfo');
  if (info) info.innerHTML = '已选择 <b>' + escHtml(name) + '</b>（' + sizeTxt + '，类型 ' + type + '）<br>已自动填入右侧路径。请将该文件放入本地工作台的 <b>' + escHtml(dir) + '/</b> 目录，自动同步后即可在线上打开。';

      it.children.forEach(function(c){ if (!found && c === section) found = {id: it.id, name: c, sub: 1}; });
    } else if (it.name === section) {
      found = {id: it.id, name: it.name, sub: 0};

}

// 导出合并后的完整清单（manifest + localStorage），便于同步进 data/ 后上线
function exportManifest() {
  var out = {};
  NavNames().forEach(function(n){
    out[n] = getSectionDocs(n).map(function(d){ return {title: d.title, file: d.file, type: d.type, desc: d.desc}; });
  });
  var blob = new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'});
  var a = document.createElement('a');

  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 500);
}

// 尝试加载 01-投研信息收集/每日晨报/ 下的晨报 PDF：失败则回退到"最近日期"探测
var MORNING_FALLBACK_DAYS = 7;
function loadMorningReport() {
  var title = document.getElementById('morningReportTitle');
  var body = document.getElementById('morningReportBody');
  if (!body) return;

  function setLoading() {
    if (title) title.textContent = '正在加载...';
    body.innerHTML = '<div class="empty-text">正在加载晨报数据...</div>';
  }
  function setEmpty(msg) {
    if (title) title.textContent = '暂无晨报';
    body.innerHTML = '<div class="empty-text">' + (msg || '暂无晨报数据，请将按日期命名的晨报 PDF 放入 01-投研信息收集/每日晨报/ 目录（命名规范：YYYY-MM-DD-晨报.pdf）。') + '</div>';
  }
  function render(url, name) {
    if (title) title.textContent = name;
    body.innerHTML = '<iframe src="' + url + '" title="' + name + '" style="width:100%;height:520px;border:0;display:block;background:#fff;"></iframe>';
  }

  // 候选列表：最新日期优先
  var candidates = [];
  var today = new Date();
  for (var i = 0; i < MORNING_FALLBACK_DAYS; i++) {
    var d = new Date(today.getTime() - i * 86400000);
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    candidates.push(y + '-' + m + '-' + day + '-晨报.pdf');
  }

  setLoading();

  function tryFetch(idx) {
    if (idx >= candidates.length) { setEmpty(); return; }
    var file = candidates[idx];
    var url = '01-投研信息收集/每日晨报/' + file;
    fetch(url, { cache: 'no-store' })
      .then(function(res) {
        if (!res.ok) throw new Error('not found');
        // 仅接受真正的 PDF 响应；SPA 回退/404 会返回 text/html 的 index.html，必须跳过继续探测
        var ct = res.headers.get('content-type') || '';
        if (ct.indexOf('application/pdf') === -1) throw new Error('not pdf');
        render(url, file);
      })
      .catch(function() { tryFetch(idx + 1); });
  }

  // 若页面按 task 指定 URL 已提供，则优先尝试；这里统一用日期探测（最新一份）
  tryFetch(0);
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function buildMacroShell(){
  var h = '';
  h += '<div class="macro-wrap">';
  // ---- 上半页 ----
  h += '<div class="macro-panel">';
  h +=   '<div class="macro-head">';
  h +=     '<div class="macro-head-l"><span class="bar"></span>全球资产 · 近一周波动<span class="sub">日度收盘 / 收益率</span></div>';
  h +=     '<div class="macro-head-r"><span id="macroUpdated">更新于 --</span><button class="btn-mini" onclick="renderMacro(true)">刷新数据</button></div>';
  h +=   '</div>';
  h +=   '<div class="macro-grid" id="macroCharts"><div class="macro-loading">正在加载行情数据...</div></div>';
  h +=   '<div class="macro-insight" id="macroInsight" hidden></div>';
  h += '</div>';
  // ---- 分隔 ----
  h += '<div class="macro-sep">中国宏观政策</div>';
  // ---- 下半页 ----
  h += '<div class="macro-panel">';
  h +=   '<div class="macro-head">';
  h +=     '<div class="macro-head-l"><span class="bar"></span>政策动态跟踪<span class="sub">货币政策 / 财政政策 / 产业政策 / 内需</span></div>';
  h +=     '<div class="macro-head-r"><span id="policyCount"></span></div>';
  h +=   '</div>';
  h +=   '<div class="policy-list" id="policyList"><div class="macro-loading">正在加载政策信息...</div></div>';
  h += '</div>';
  h += '</div>';
  // 宏观研究文档区：展示 data/manifest.json 中「宏观研究」分类下的报告（如每日全球要闻）
  h += '<div class="docs-section" id="docsSection"></div>';
  return h;
}

function loadMacroData(cb){
  var ok = false;
  try {
    fetch('data/macro-weekly.json', { cache: 'no-store' })
      .then(function(res){
        if (!res.ok) throw new Error('http');
        var ct = res.headers.get('content-type') || '';
        if (ct.indexOf('json') === -1) throw new Error('not json');
        return res.json();
      })
      .then(function(j){
        if (j && j.markets && j.markets.length) cb(j);
        else cb(MACRO_SNAPSHOT);
      })
      .catch(function(){ cb(MACRO_SNAPSHOT); });
  } catch (e) {
    cb(MACRO_SNAPSHOT);
  }
}

function renderMacro(force){
  var box = document.getElementById('macroCharts');
  if (!box) return;
  box.innerHTML = '<div class="macro-loading">正在加载行情数据...</div>';
  var plist = document.getElementById('policyList');
  if (plist) plist.innerHTML = '<div class="macro-loading">正在加载政策信息...</div>';

  loadMacroData(function(data){
    var box2 = document.getElementById('macroCharts');
    var list2 = document.getElementById('policyList');
    if (!box2) return;
    var markets = (data && data.markets) || [];
    var policies = (data && data.policies) || [];

    if (!markets.length) {
      box2.innerHTML = '<div class="macro-loading">暂无行情数据，请运行 tools/refresh_macro.py 生成 data/macro-weekly.json</div>';
    } else {
      box2.innerHTML = markets.map(function(m){ return macroCard(m); }).join('');
    }

    var up = document.getElementById('macroUpdated');
    if (up) up.textContent = '更新于 ' + (data.updated || '--');

    // 盘前提示（波动曲线下方）
    var ibox = document.getElementById('macroInsight');
    if (ibox) {
      var idata = (data && data.insight) || null;
      var hasIns = idata && (idata.headline || (idata.items && idata.items.length));
      ibox.hidden = !hasIns;
      ibox.innerHTML = hasIns ? macroInsight(idata) : '';
    }

    if (list2) {
      list2.innerHTML = policies.length
        ? policies.map(function(p){ return policyItem(p); }).join('')
        : '<div class="macro-loading">暂无政策条目</div>';
    }
    var pc = document.getElementById('policyCount');
    if (pc) pc.textContent = policies.length ? ('共 ' + policies.length + ' 条 · 按时间倒序') : '';
  });
}

function macroCard(m){
  var pts = m.points || [];
  var lines = m.lines || [];
  var last = pts.length ? pts[pts.length - 1] : null;
  var first = pts.length ? pts[0] : null;

  var numHtml = '';
  if (last) {
    lines.forEach(function(L){
      var lv = last[L.field], fv = first ? first[L.field] : lv;
      var diff = (typeof lv === 'number' && typeof fv === 'number') ? lv - fv : 0;
      var pct = fv ? (diff / Math.abs(fv) * 100) : 0;
      var cls = diff > 0.00001 ? 'up' : (diff < -0.00001 ? 'down' : 'flat');
      var sign = diff > 0 ? '+' : '';
      numHtml += '<div><span class="macro-last" style="font-size:' + (lines.length > 1 ? '14px' : '17px') + '">'
        + fmtNum(lv) + '</span><span class="macro-chg ' + cls + '">' + sign + pct.toFixed(2) + '%（' + sign + fmtNum(diff) + '）</span></div>';
    });
  }

  var legend = '';
  if (lines.length > 1) {
    legend = '<div class="macro-legend">' + lines.map(function(L){
      return '<span><i style="background:' + L.color + '"></i>' + esc(L.label) + '</span>';
    }).join('') + '</div>';
  }

  var rng = pts.length ? (pts[0].d + ' ~ ' + pts[pts.length - 1].d) : '--';
  return '<div class="macro-card">'
    + '<div class="macro-card-top">'
    +   '<div><div class="macro-card-name">' + esc(m.name) + '</div>'
    +   '<div class="macro-card-meta">单位：' + esc(m.unit || '') + (m.note ? ' · ' + esc(m.note) : '') + '</div></div>'
    +   '<div class="macro-card-num">' + numHtml + '</div>'
    + '</div>'
    + legend
    + '<div class="macro-chart">' + macroChart(pts, lines) + '</div>'
    + '<div class="macro-foot"><span>区间 ' + esc(rng) + '</span><span>来源：' + esc(m.source || '') + '</span></div>'
    + '</div>';
}

// 盘前提示区块：主线一句话 + 逐品种解读（涨红跌绿）
function macroInsight(d){
  var h = '';
  h += '<div class="macro-insight-h"><span class="dot"></span>盘前提示 · 一周主线</div>';
  if (d.headline) h += '<div class="macro-insight-lead">' + esc(d.headline) + '</div>';
  var items = d.items || [];
  if (items.length) {
    h += '<div class="macro-insight-list">' + items.map(function(it){
      var tone = it.tone === 'up' ? 'pos' : (it.tone === 'down' ? 'neg' : 'neu');
      return '<div class="macro-insight-row ' + tone + '">'
        + '<span class="k">' + esc(it.k) + '</span>'
        + '<span class="v"><em>' + esc(it.chg || '') + '</em>'
        + (it.text ? esc(it.text) : '') + '</span></div>';
    }).join('') + '</div>';
  }
  h += '<div class="macro-insight-foot">由四类资产周变动自动生成，仅为盘前观察视角，不构成投资建议。</div>';
  return h;
}

function policyItem(p, i){
  var tag = p.tag || '政策';
  var cls = '';
  if (tag.indexOf('货币') >= 0 || tag.indexOf('财政') >= 0) cls = 'p2';
  else if (tag.indexOf('产业') >= 0 || tag.indexOf('投资') >= 0) cls = 'p3';
  else if (tag.indexOf('内需') >= 0 || tag.indexOf('消费') >= 0) cls = 'p4';
  return '<div class="policy-item">'
    + '<div class="policy-top"><span class="policy-tag ' + cls + '">' + esc(tag) + '</span>'
    + '<span class="policy-date">' + esc(p.date) + '</span></div>'
    + '<div class="policy-title">' + esc(p.title) + '</div>'
    + '<div class="policy-sum">' + esc(p.summary) + '</div>'
    + '<div class="policy-src">来源：' + esc(p.source || '') + '</div>'
    + '</div>';
}

function fmtNum(v){
  if (typeof v !== 'number' || isNaN(v)) return '--';
  var a = Math.abs(v);
  if (a >= 1000) return v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (a >= 10) return v.toFixed(2);
  if (a >= 1) return v.toFixed(3);
  return v.toFixed(4);
}

// 纯 SVG 折线图（无外部依赖）
var macroGid = 0;
function macroChart(points, lines){
  var n = points.length;
  if (!n || !lines.length) return '';
  var W = 340, H = 118, PL = 10, PR = 10, PT = 12, PB = 22;
  var vals = [];
  lines.forEach(function(L){
    points.forEach(function(p){ if (typeof p[L.field] === 'number') vals.push(p[L.field]); });
  });
  if (!vals.length) return '';
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mx === mn) { mx = mn + 1; mn = mn - 1; }
  var pad = (mx - mn) * 0.18; mn -= pad; mx += pad;

  function X(i){ return n <= 1 ? PL + (W - PL - PR) / 2 : PL + (W - PL - PR) * i / (n - 1); }
  function Y(v){ return PT + (H - PT - PB) * (1 - (v - mn) / (mx - mn)); }

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  // 面积（仅单线时）
  if (lines.length === 1) {
    var f = lines[0].field;
    var dArea = 'M' + X(0).toFixed(1) + ',' + (H - PB).toFixed(1);
    points.forEach(function(p, i){ dArea += ' L' + X(i).toFixed(1) + ',' + Y(p[f]).toFixed(1); });
    dArea += ' L' + X(n - 1).toFixed(1) + ',' + (H - PB).toFixed(1) + ' Z';
    var gid = 'mg' + (++macroGid);
    s += '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="' + lines[0].color + '" stop-opacity="0.30"/>'
      + '<stop offset="100%" stop-color="' + lines[0].color + '" stop-opacity="0"/></linearGradient></defs>';
    s += '<path d="' + dArea + '" fill="url(#' + gid + ')"/>';
  }
  // 网格
  for (var g = 0; g <= 3; g++) {
    var gy = PT + (H - PT - PB) * g / 3;
    s += '<line x1="' + PL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + gy.toFixed(1)
      + '" stroke="#1F2937" stroke-width="1" stroke-dasharray="3 3"/>';
  }
  // 折线 + 数据点
  lines.forEach(function(L){
    var d = '';
    points.forEach(function(p, i){
      d += (i ? ' L' : 'M') + X(i).toFixed(1) + ',' + Y(p[L.field]).toFixed(1);
    });
    s += '<path d="' + d + '" fill="none" stroke="' + L.color + '" stroke-width="2" '
      + 'stroke-linejoin="round" stroke-linecap="round"/>';
    points.forEach(function(p, i){
      s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p[L.field]).toFixed(1) + '" r="2.6" '
        + 'fill="' + L.color + '" stroke="#111827" stroke-width="1.2"/>';
    });
  });
  // 悬停提示（透明热区 + 原生 title）
  points.forEach(function(p, i){
    var tip = p.d + '  ' + lines.map(function(L){ return L.label + ' ' + fmtNum(p[L.field]); }).join(' / ');
    var cyTop = Y(Math.max.apply(null, lines.map(function(L){ return p[L.field]; })));
    s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + ((PT + cyTop) / 2).toFixed(1)
      + '" r="10" fill="transparent"><title>' + esc(tip) + '</title></circle>';
  });
  // 纵轴极值
  s += '<text x="' + (W - PR) + '" y="' + (PT + 4) + '" text-anchor="end" font-size="8.5" fill="#6B7280">' + fmtNum(mx - pad) + '</text>';
  s += '<text x="' + (W - PR) + '" y="' + (H - PB + 2) + '" text-anchor="end" font-size="8.5" fill="#6B7280">' + fmtNum(mn + pad) + '</text>';
  // 横轴日期
  points.forEach(function(p, i){
    var anchor = i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle');
    s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="' + anchor
      + '" font-size="8.5" fill="#6B7280">' + esc(p.d) + '</text>';
  });
  s += '</svg>';
  return s;
}

// ============ SEARCH ============
function setupSearch() {
  var input = document.getElementById('searchInput');
  if (!input) return;
  function findNav(q) {
    var found = null;
    NAV.forEach(function(g) {
      g.items.forEach(function(item) {
        if (found) return;
        if (item.name.indexOf(q) !== -1) found = item;
      });
    });
    return found;
  }
  function goNav(found) {
    var el = document.querySelector('.nav-item[data-id="' + CSS.escape(found.id) + '"][data-name="' + CSS.escape(found.name) + '"]');
    if (el) { selectItem(el); return; }
    var sub = document.querySelector('.nav-sub-item[data-name="' + CSS.escape(found.name) + '"]');
    if (sub) selectItem(sub);
  }
  input.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    var q = (input.value || '').trim();
    if (!q) return;
    var found = findNav(q);
    if (found) goNav(found);
  });
  input.addEventListener('input', function() {
    var q = (input.value || '').trim();
    // 精确输入板块名 → 保留原有跳转导航行为
    var exact = null;
    NAV.forEach(function(g) {
      g.items.forEach(function(it) {
        if (exact) return;
        if (it.name === q) exact = it;
        else if (it.children && it.children.length) {
          it.children.forEach(function(c) { if (!exact && c === q) exact = {id: it.id, name: c}; });
        }
      });
    });
    if (exact) { goNav(exact); return; }
    // 普通板块：实时过滤当前文档列表
    if (currentSection) filterDocs(q);
  });
}

// ============ MOBILE ============
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
window.addEventListener('resize',function(){
  if(window.innerWidth>768){closeSidebar()}
});

// ============ DEFAULT SELECT ============
// 默认选中"每日晨报"板块（页面加载时自动 fetch 每日晨报目录最新 PDF）
setupSearch();
var defaultItem = document.querySelector('.nav-item[data-name="每日晨报"]');
if (defaultItem) {
  selectItem(defaultItem);
} else {
  var firstItem = document.querySelector('.nav-item');
  if (firstItem) selectItem(firstItem);
}
