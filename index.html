<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>投研工作台</title>
<style>
:root{
  --bg-primary:#0A0E17;
  --bg-sidebar:#0D1220;
  --bg-hover:#111827;
  --bg-active:#1A2636;
  --bg-card:#111827;
  --bg-input:#111827;
  --border:#1F2937;
  --text-primary:#FFFFFF;
  --text-secondary:#D1D5DB;
  --text-muted:#9CA3AF;
  --text-dim:#6B7280;
  --accent:#00E5FF;
  --accent-purple:#8B5CF6;
  --success:#10B981;
  --icon-dim:#374151;
  --sidebar-width:240px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{
  font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg-primary);color:var(--text-primary);
  min-height:100vh;line-height:1.5;
}

/* ====== HEADER ====== */
.header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:56px;background:var(--bg-sidebar);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;
}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent-purple));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:16px;
}
.header-info{display:flex;flex-direction:column;line-height:1.2}
.header-title{font-size:16px;font-weight:600;color:var(--text-primary)}
.header-sub{font-size:11px;color:var(--text-muted)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.header-date{font-size:13px;color:var(--text-muted)}
.menu-toggle{
  display:none;background:none;border:none;color:var(--text-primary);
  font-size:1.4rem;cursor:pointer;padding:4px 6px;line-height:1;
}

/* ====== SIDEBAR ====== */
.sidebar{
  position:fixed;top:56px;left:0;bottom:0;
  width:var(--sidebar-width);background:var(--bg-sidebar);
  border-right:1px solid var(--border);
  overflow-y:auto;z-index:90;display:flex;flex-direction:column;
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.nav-group{padding:8px 0}
.nav-group-label{
  padding:10px 16px 4px;font-size:11px;font-weight:600;
  color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 16px 8px 14px;cursor:pointer;
  font-size:13px;color:var(--text-secondary);
  border-left:2px solid transparent;
  transition:all .15s;user-select:none;
}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-item.active{
  background:var(--bg-active);color:var(--accent);
  border-left-color:var(--accent);
}
.nav-item .nav-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}

/* 工具与模板的子项 */
.nav-sub{
  max-height:0;overflow:hidden;transition:max-height .25s ease;
}
.nav-sub.expanded{max-height:200px}
.nav-sub-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 16px 7px 46px;cursor:pointer;
  font-size:12px;color:var(--text-muted);
  transition:all .15s;
}
.nav-sub-item:hover{color:var(--text-primary);background:var(--bg-hover)}
.nav-sub-item.active{color:var(--accent);background:var(--bg-active)}
.nav-item.has-children .nav-arrow{
  margin-left:auto;font-size:10px;color:var(--text-dim);
  transition:transform .2s;
}
.nav-item.has-children.open .nav-arrow{transform:rotate(90deg)}

/* Sidebar footer */
.sidebar-footer{
  margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:8px;font-size:11px;color:var(--success);
}
.sidebar-footer .dot{
  width:6px;height:6px;border-radius:50%;background:var(--success);
}

/* ====== MAIN ====== */
.main{
  margin-left:var(--sidebar-width);padding:24px 32px;
  min-height:calc(100vh - 56px);padding-top:80px;
}
.main-inner{max-width:1000px}

/* Page title */
.page-title{font-size:24px;font-weight:700;color:var(--text-primary);margin-bottom:20px}

/* Search bar */
.search-bar{
  display:flex;align-items:center;background:var(--bg-input);
  border-radius:10px;padding:10px 16px;gap:12px;margin-bottom:32px;
}
.search-bar .search-icon{color:var(--text-dim);display:flex}
.search-bar input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text-primary);font-size:14px;font-family:inherit;
}
.search-bar input::placeholder{color:var(--text-dim)}
.btn-add{
  flex-shrink:0;padding:8px 18px;border-radius:8px;border:none;
  background:linear-gradient(90deg,var(--accent),var(--accent-purple));
  color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;white-space:nowrap;
  transition:filter .15s;
}
.btn-add:hover{filter:brightness(1.15)}

/* Empty state */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;text-align:center;
}
.empty-icon{color:var(--icon-dim);margin-bottom:16px}
.empty-text{font-size:14px;color:var(--text-dim)}

/* Readme card */
.readme-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;padding:20px 24px;margin-bottom:16px;
}
.readme-card h2{
  font-size:16px;color:var(--accent);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.readme-card h2 .breadcrumb{font-size:12px;color:var(--text-dim);font-weight:400}
.readme-card .desc{font-size:14px;color:var(--text-secondary);line-height:1.7}
.readme-card .meta{
  font-size:12px;color:var(--text-dim);margin-top:12px;
  padding-top:10px;border-top:1px solid var(--border);
}

/* Template preview */
.tpl-preview{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;margin-bottom:16px;overflow:hidden;
}
.tpl-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:var(--bg-active);border-bottom:1px solid var(--border);
}
.tpl-header h3{font-size:14px;color:var(--text-primary);display:flex;align-items:center;gap:8px}
.tpl-header .tag{
  font-size:11px;padding:2px 8px;border-radius:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent-purple));color:#fff;
}
.tpl-body{
  padding:16px 20px;max-height:520px;overflow-y:auto;
  font-size:13px;line-height:1.7;color:var(--text-secondary);
}
.tpl-body::-webkit-scrollbar{width:4px}
.tpl-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tpl-body h1{font-size:17px;margin:0 0 8px;color:var(--text-primary)}
.tpl-body h2{
  font-size:14px;margin:16px 0 6px;color:var(--accent);
  border-bottom:1px solid var(--border);padding-bottom:4px;
}
.tpl-body h3{font-size:13px;margin:12px 0 4px;color:var(--text-primary)}
.tpl-body p{margin:4px 0}
.tpl-body ul{margin:4px 0;padding-left:18px}
.tpl-body li{margin:2px 0;color:var(--text-muted)}
.tpl-body table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12px}
.tpl-body th,.tpl-body td{border:1px solid var(--border);padding:4px 8px;text-align:left}
.tpl-body th{background:var(--bg-hover);color:var(--text-primary);font-weight:600}
.tpl-body td{color:var(--text-muted)}
.tpl-body hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.tpl-body strong{color:var(--text-primary)}

/* Template list */
.tpl-list{display:flex;flex-direction:column;gap:12px}
.tpl-list-item{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:10px;padding:14px 18px;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;gap:12px;
}
.tpl-list-item:hover{border-color:var(--accent);background:var(--bg-hover)}
.tpl-list-item .tpl-icon{
  width:36px;height:36px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent-purple));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;flex-shrink:0;
}
.tpl-list-item .tpl-info h4{font-size:14px;color:var(--text-primary);margin-bottom:2px}
.tpl-list-item .tpl-info p{font-size:12px;color:var(--text-muted)}

/* Overlay */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:85}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .main{margin-left:0;padding:16px;padding-top:72px}
  .menu-toggle{display:block}
  .search-bar{flex-wrap:wrap}
  .btn-add{width:100%;text-align:center}
}

/* report list for 行业研究 */
.report-list{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.report-item{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.report-item a{color:var(--accent);text-decoration:none;font-size:14px;font-weight:600}
.report-item a:hover{text-decoration:underline}
.report-desc{color:var(--text-muted);font-size:12px}
</style>
</head>

var sidebar = document.getElementById('sidebar');

// Build sidebar
NAV.forEach(function(g){
  var group = document.createElement('div');
  group.className = 'nav-group';

  var label = document.createElement('div');
  label.className = 'nav-group-label';
  label.textContent = g.label;
  group.appendChild(label);

  g.items.forEach(function(item){
    var el = document.createElement('div');
    var hasKids = item.children && item.children.length;
    el.className = 'nav-item' + (hasKids ? ' has-children' : '');
    el.innerHTML = '<span class="nav-icon">' + (ICONS[item.icon]||'') + '</span>' +
      '<span>' + item.name + '</span>' +
      (hasKids ? '<span class="nav-arrow">&#9654;</span>' : '');
    el.dataset.id = item.id;
    el.dataset.name = item.name;
    el.dataset.hasChildren = hasKids ? '1' : '0';

    el.addEventListener('click', function(e){
      e.stopPropagation();
      if (hasKids) {
        // toggle submenu
        var sub = this.nextElementSibling;
        if (sub && sub.classList.contains('nav-sub')) {
          var open = sub.classList.contains('expanded');
          sub.classList.toggle('expanded', !open);
          this.classList.toggle('open', !open);
        }
        // if closing, also select parent
        if (!this.classList.contains('open')) {
          selectItem(this);
        }
      } else {
        selectItem(this);
      }
      if (window.innerWidth <= 768) closeSidebar();
    });
    group.appendChild(el);

    // submenu for 工具与模板
    if (hasKids) {
      var subDiv = document.createElement('div');
      subDiv.className = 'nav-sub';
      item.children.forEach(function(childName){
        var subItem = document.createElement('div');
        subItem.className = 'nav-sub-item';
        subItem.textContent = childName;
        subItem.dataset.id = item.id;
        subItem.dataset.name = childName;
        subItem.dataset.isSub = '1';
        subItem.addEventListener('click', function(e){
          e.stopPropagation();
          selectItem(this);
          if (window.innerWidth <= 768) closeSidebar();
        });
        subDiv.appendChild(subItem);
      });
      group.appendChild(subDiv);
    }
  });

  sidebar.appendChild(group);
});

// ============ SELECT ============
function selectItem(el) {
  document.querySelectorAll('.nav-item, .nav-sub-item').forEach(function(e){ e.classList.remove('active'); });
  el.classList.add('active');

  var dirKey = el.dataset.id;
  var name = el.dataset.name;

  // If sub-item: expand parent
  if (el.dataset.isSub === '1') {
    var prev = el.parentElement.previousElementSibling;
    if (prev && prev.classList.contains('has-children')) {
      prev.classList.add('open');
      el.parentElement.classList.add('expanded');
    }
  }

  // Update page title
  var title = mainContent.querySelector('.page-title');
  if (title) title.textContent = name;

  var descKey = dirKey + '|||' + name;
  var desc = README[descKey] || '';
  var isTplItem = dirKey === '07-工具与模板' && TM[name];

  var html = '';

  if (isTplItem) {
    // Show template preview
    html += '<div class="readme-card"><h2>' + name + '</h2><div class="desc">' + desc + '</div></div>';
    html += '<div class="tpl-preview"><div class="tpl-header"><h3><span class="tag">模板预览</span> ' + name + '.md</h3></div>';
    html += '<div class="tpl-body">' + renderMD(TM[name]) + '</div></div>';
  } else if (name === '工具与模板') {
    // Show template list
    html += '<div class="readme-card"><h2>工具与模板</h2><div class="desc">存放投研工作所需的各类模板文件，包括日报、周报、复盘等结构化模板。</div></div>';
    html += '<div class="tpl-list">';
    ['日报模板','周报模板','复盘模板'].forEach(function(tn){
      html += '<div class="tpl-list-item" onclick="selectByName(\'07-工具与模板\',\'\'+tn+\'\')">';
      html += '<div class="tpl-icon">&#9998;</div>';
      html += '<div class="tpl-info"><h4>' + tn + '</h4><p>' + (README['07-工具与模板|||'+tn]||'') + '</p></div>';
      html += '</div>';
    });
    html += '</div>';
  } else if (name === '每日晨报') {
    // 每日晨报：展示 README 描述 + 异步加载 data/ 最新晨报 PDF（内嵌 PDF 查看器展示）
    html += '<div class="readme-card"><h2><span class="breadcrumb">' + dirKey + ' /</span> ' + name + '</h2>';
    html += '<div class="desc">' + (desc || '每日盘前晨报，覆盖隔夜市场与A股资金面。') + '</div>';
    html += '<div class="meta">自动加载：data/ 目录下最新一份按日期命名的晨报 PDF（YYYY-MM-DD-晨报.pdf）</div></div>';
    html += '<div class="tpl-preview"><div class="tpl-header"><h3><span class="tag">每日晨报</span> <span id="morningReportTitle">正在加载...</span></h3></div>';
    html += '<div class="tpl-body" id="morningReportBody" style="padding:0"><div class="empty-text">正在加载晨报数据...</div></div></div>';
  } else if (dirKey === '05-行业与个股分析' && name === '行业研究') {
    // Show readme card + report list
    html += '<div class="readme-card"><h2><span class="breadcrumb">' + dirKey + ' /</span> ' + name + '</h2>';
    html += '<div class="desc">' + (desc || '暂无描述信息') + '</div>';
    html += '<div class="meta">来源：' + dirKey + '/' + name + '/README.md</div></div>';
    html += '<div class="report-list">';
    html += '<div class="report-item"><a href="05-行业与个股分析/行业研究/七大新兴产业深度投资研究报告.md" target="_blank">&#128196; 七大新兴产业深度投资研究报告.md</a><span class="report-desc">七大新兴产业（新一代信息技术、高端装备、新材料、生物医药、新能源汽车、节能环保、数字创意）深度投资分析，含行业景气、产业链、竞争格局与投资策略</span></div>';
    html += '</div>';
  } else {
    // Show readme card
    html += '<div class="readme-card"><h2><span class="breadcrumb">' + dirKey + ' /</span> ' + name + '</h2>';
    html += '<div class="desc">' + (desc || '暂无描述信息') + '</div>';

function selectByName(dirKey, name) {
  var el = document.querySelector('.nav-sub-item[data-id="'+dirKey+'"][data-name="'+CSS.escape(name)+'"]');
  if (!el) el = document.querySelector('.nav-item[data-id="'+dirKey+'"][data-name="'+CSS.escape(name)+'"]');
  if (el) selectItem(el);
}

// ============ MARKDOWN RENDER ============
function renderMD(md) {
  var h = md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^---$/gm,'<hr>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^- (.+)$/gm,'<li>$1</li>');
  h = h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h = h.replace(/((?:\|.+\|\n)+)/g,function(m){
    var lines=m.trim().split('\n').filter(function(l){return l.indexOf('|')!==-1});
    if(lines.length<2)return m;
    var dl=lines.filter(function(l){return !/^\|[\s\-:|]+\|$/.test(l)});
    if(dl.length===0)return m;
    var th='<thead><tr>'+dl[0].split('|').filter(function(c){return c.trim()}).map(function(c){return'<th>'+c.trim()+'</th>'}).join('')+'</tr></thead>';
    var tb='<tbody>'+dl.slice(1).map(function(l){
      return'<tr>'+l.split('|').filter(function(c){return c.trim()}).map(function(c){return'<td>'+c.trim()+'</td>'}).join('')+'</tr>'
    }).join('')+'</tbody>';
    return'<table>'+th+tb+'</table>';
  });
  h=h.replace(/\n\n/g,'</p><p>');
  h='<p>'+h+'</p>';
  h=h.replace(/<p>\s*<\/p>/g,'');
  h=h.replace(/<p><h([1-3])>/g,'<h$1>');
  h=h.replace(/<\/h([1-3])><\/p>/g,'</h$1>');
  h=h.replace(/<p><ul>/g,'<ul>');
  h=h.replace(/<\/ul><\/p>/g,'</ul>');
  h=h.replace(/<p><table>/g,'<table>');
  h=h.replace(/<\/table><\/p>/g,'</table>');
  h=h.replace(/<p><hr><\/p>/g,'<hr>');
  return h;
}

// ============ MORNING REPORT (DATA-DRIVEN) ============
// 尝试加载 data/ 目录下的晨报 PDF：优先加载指定文件，失败则回退到"最近日期"探测
var MORNING_FALLBACK_DAYS = 7;
function loadMorningReport() {
  var title = document.getElementById('morningReportTitle');
  var body = document.getElementById('morningReportBody');
  if (!body) return;

  function setLoading() {
    if (title) title.textContent = '正在加载...';
    body.innerHTML = '<div class="empty-text">正在加载晨报数据...</div>';
  }
  function setEmpty(msg) {
    if (title) title.textContent = '暂无晨报';
    body.innerHTML = '<div class="empty-text">' + (msg || '暂无晨报数据，请将按日期命名的晨报 PDF 放入 data/ 目录（命名规范：YYYY-MM-DD-晨报.pdf）。') + '</div>';
  }
  function render(url, name) {
    if (title) title.textContent = name;
    body.innerHTML = '<iframe src="' + url + '" title="' + name + '" style="width:100%;height:520px;border:0;display:block;background:#fff;"></iframe>';
  }

  // 候选列表：最新日期优先
  var candidates = [];
  var today = new Date();
  for (var i = 0; i < MORNING_FALLBACK_DAYS; i++) {
    var d = new Date(today.getTime() - i * 86400000);
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    candidates.push(y + '-' + m + '-' + day + '-晨报.pdf');
  }

  setLoading();

  function tryFetch(idx) {
    if (idx >= candidates.length) { setEmpty(); return; }
    var file = candidates[idx];
    var url = 'data/' + file;
    fetch(url, { cache: 'no-store' })
      .then(function(res) {
        if (!res.ok) throw new Error('not found');
        render(url, file);
      })
      .catch(function() { tryFetch(idx + 1); });
  }

  // 若页面按 task 指定 URL 已提供，则优先尝试；这里统一用日期探测（最新一份）
  tryFetch(0);
}

// ============ SEARCH ============
function setupSearch() {
  var input = document.querySelector('.search-bar input');
  if (!input) return;
  var btn = document.querySelector('.btn-add');
  function doSearch() {
    var q = (input.value || '').trim();
    if (!q) return;
    // 在 NAV 中按名称模糊匹配
    var found = null;
    NAV.forEach(function(g) {
      g.items.forEach(function(item) {
        if (found) return;
        if (item.name.indexOf(q) !== -1) found = item;
      });
    });
    if (found) {
      var el = document.querySelector('.nav-item[data-name="' + CSS.escape(found.name) + '"]');
      if (el) selectItem(el);
    }
  }
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { doSearch(); }
  });
  input.addEventListener('input', doSearch);
  if (btn) btn.addEventListener('click', doSearch);
}

// ============ MOBILE ============
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
window.addEventListener('resize',function(){
  if(window.innerWidth>768){closeSidebar()}
});

// 默认选中"每日晨报"板块（页面加载时自动 fetch data/ 最新晨报）
setupSearch();
var defaultItem = document.querySelector('.nav-item[data-name="每日晨报"]');
if (defaultItem) {
  selectItem(defaultItem);
} else {
  var firstItem = document.querySelector('.nav-item');
  if (firstItem) selectItem(firstItem);
